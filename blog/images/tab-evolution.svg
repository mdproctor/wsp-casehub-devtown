<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="system-ui, sans-serif">
  <style>
    .label { font-size: 11px; fill: #404040; }
    .phase { font-size: 10px; fill: #737373; font-weight: 600; text-transform: uppercase; }
    .tab { rx: 4; ry: 4; }
    .tab-text { font-size: 9px; fill: white; font-weight: 600; text-anchor: middle; }
    .existing { fill: #6366f1; }
    .new-tab { fill: #059669; }
    .arrow { fill: none; stroke: #a1a1aa; stroke-width: 1.5; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/>
    </marker>
  </defs>

  <text x="20" y="30" class="phase">Before (#216)</text>
  <rect x="20" y="40" width="100" height="26" class="tab existing"/>
  <text x="70" y="57" class="tab-text">Review Workbench</text>
  <rect x="125" y="40" width="75" height="26" class="tab existing"/>
  <text x="162" y="57" class="tab-text">Operations</text>
  <rect x="205" y="40" width="80" height="26" class="tab existing"/>
  <text x="245" y="57" class="tab-text">Merge Queue</text>
  <rect x="290" y="40" width="70" height="26" class="tab existing"/>
  <text x="325" y="57" class="tab-text">Reviewers</text>
  <rect x="365" y="40" width="80" height="26" class="tab existing"/>
  <text x="405" y="57" class="tab-text">Contributors</text>
  <rect x="450" y="40" width="60" height="26" class="tab existing"/>
  <text x="480" y="57" class="tab-text">System</text>

  <path d="M 280 78 L 280 110" class="arrow"/>

  <text x="20" y="130" class="phase">After (#291)</text>
  <rect x="20" y="140" width="100" height="26" class="tab existing"/>
  <text x="70" y="157" class="tab-text">Review Workbench</text>
  <rect x="125" y="140" width="75" height="26" class="tab existing"/>
  <text x="162" y="157" class="tab-text">Operations</text>
  <rect x="205" y="140" width="80" height="26" class="tab existing"/>
  <text x="245" y="157" class="tab-text">Merge Queue</text>
  <rect x="290" y="140" width="70" height="26" class="tab existing"/>
  <text x="325" y="157" class="tab-text">Reviewers</text>
  <rect x="365" y="140" width="80" height="26" class="tab existing"/>
  <text x="405" y="157" class="tab-text">Contributors</text>
  <rect x="450" y="140" width="50" height="26" class="tab new-tab"/>
  <text x="475" y="157" class="tab-text">Trust</text>
  <rect x="505" y="140" width="70" height="26" class="tab new-tab"/>
