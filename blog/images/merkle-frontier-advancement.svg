<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="500" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Merkle Frontier — How Entries Accumulate</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#64748b">Frontier size = Integer.bitCount(entry count)</text>

  <!-- Row labels -->
  <text x="30" y="108" font-size="11" font-weight="600" fill="#475569">1 entry</text>
  <text x="30" y="218" font-size="11" font-weight="600" fill="#475569">2 entries</text>
  <text x="30" y="338" font-size="11" font-weight="600" fill="#475569">3 entries</text>
  <text x="30" y="448" font-size="11" font-weight="600" fill="#475569">4 entries</text>

  <!-- Frontier count labels -->
  <text x="730" y="108" font-size="11" font-weight="600" fill="#059669">1 node</text>
  <text x="720" y="218" font-size="11" font-weight="600" fill="#059669">1 node</text>
  <text x="716" y="338" font-size="11" font-weight="600" fill="#059669">2 nodes</text>
  <text x="720" y="448" font-size="11" font-weight="600" fill="#059669">1 node</text>

  <!-- bitCount annotations -->
  <text x="730" y="122" font-size="9" fill="#64748b">bitCount(1)=1</text>
  <text x="720" y="232" font-size="9" fill="#64748b">bitCount(2)=1</text>
  <text x="716" y="352" font-size="9" fill="#64748b">bitCount(3)=2</text>
  <text x="720" y="462" font-size="9" fill="#64748b">bitCount(4)=1</text>

  <!-- Separator lines -->
  <line x1="90" y1="145" x2="700" y2="145" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3"/>
  <line x1="90" y1="260" x2="700" y2="260" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3"/>
  <line x1="90" y1="380" x2="700" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3"/>

  <!-- STATE 1: 1 entry, 1 frontier node -->
  <!-- Entry E1 -->
  <rect x="120" y="78" width="100" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="170" y="98" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₁</text>
  <text x="170" y="114" text-anchor="middle" font-size="9" fill="#3b82f6">hash: a3f...</text>

  <!-- Arrow to frontier -->
  <line x1="220" y1="103" x2="340" y2="103" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Frontier F0 -->
  <rect x="350" y="82" width="120" height="42" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="410" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#064e3b">F₀</text>
  <text x="410" y="114" text-anchor="middle" font-size="9" fill="#059669">level 0: a3f...</text>

  <!-- STATE 2: 2 entries, 1 frontier node (merged) -->
  <!-- Entries -->
  <rect x="120" y="168" width="80" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="160" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₁</text>
  <text x="160" y="200" text-anchor="middle" font-size="9" fill="#3b82f6">a3f...</text>

  <rect x="210" y="168" width="80" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="250" y="186" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₂</text>
  <text x="250" y="200" text-anchor="middle" font-size="9" fill="#3b82f6">7c1...</text>

  <!-- Merge -->
  <line x1="160" y1="212" x2="205" y2="232" stroke="#64748b" stroke-width="1"/>
  <line x1="250" y1="212" x2="205" y2="232" stroke="#64748b" stroke-width="1"/>
  <circle cx="205" cy="232" r="4" fill="#64748b"/>
  <text x="205" y="248" text-anchor="middle" font-size="8" fill="#64748b">merge</text>

  <line x1="205" y1="228" x2="350" y2="195" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Frontier: single node at level 1 -->
  <rect x="350" y="178" width="150" height="42" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="425" y="196" text-anchor="middle" font-size="10" font-weight="600" fill="#064e3b">F₁</text>
  <text x="425" y="210" text-anchor="middle" font-size="9" fill="#059669">level 1: H(a3f∥7c1)</text>

  <!-- STATE 3: 3 entries, 2 frontier nodes -->
  <!-- Entries -->
  <rect x="120" y="288" width="70" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="155" y="306" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₁</text>
  <text x="155" y="320" text-anchor="middle" font-size="9" fill="#3b82f6">a3f...</text>

  <rect x="195" y="288" width="70" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="230" y="306" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₂</text>
  <text x="230" y="320" text-anchor="middle" font-size="9" fill="#3b82f6">7c1...</text>

  <rect x="270" y="288" width="70" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="305" y="306" text-anchor="middle" font-size="10" font-weight="500" fill="#78350f">E₃</text>
  <text x="305" y="320" text-anchor="middle" font-size="9" fill="#d97706">b92...</text>

  <!-- Merge of E1+E2 -->
  <line x1="155" y1="332" x2="190" y2="348" stroke="#64748b" stroke-width="1"/>
  <line x1="230" y1="332" x2="190" y2="348" stroke="#64748b" stroke-width="1"/>
  <circle cx="190" cy="348" r="3" fill="#64748b"/>

  <!-- Two arrows to two frontier nodes -->
  <line x1="190" y1="345" x2="400" y2="308" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="305" y1="332" x2="540" y2="308" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Two frontier nodes -->
  <rect x="400" y="290" width="130" height="40" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="465" y="306" text-anchor="middle" font-size="10" font-weight="600" fill="#064e3b">F₁</text>
  <text x="465" y="320" text-anchor="middle" font-size="9" fill="#059669">level 1</text>

  <rect x="540" y="290" width="110" height="40" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="595" y="306" text-anchor="middle" font-size="10" font-weight="600" fill="#064e3b">F₀</text>
  <text x="595" y="320" text-anchor="middle" font-size="9" fill="#059669">level 0</text>

  <!-- STATE 4: 4 entries, 1 frontier node (full merge) -->
  <rect x="120" y="400" width="60" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="150" y="416" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₁</text>
  <text x="150" y="430" text-anchor="middle" font-size="8" fill="#3b82f6">a3f</text>

  <rect x="184" y="400" width="60" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="214" y="416" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₂</text>
  <text x="214" y="430" text-anchor="middle" font-size="8" fill="#3b82f6">7c1</text>

  <rect x="248" y="400" width="60" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="278" y="416" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₃</text>
  <text x="278" y="430" text-anchor="middle" font-size="8" fill="#3b82f6">b92</text>

  <rect x="312" y="400" width="60" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="342" y="416" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">E₄</text>
  <text x="342" y="430" text-anchor="middle" font-size="8" fill="#3b82f6">d44</text>

  <!-- Merge tree -->
  <line x1="150" y1="440" x2="182" y2="455" stroke="#64748b" stroke-width="1"/>
  <line x1="214" y1="440" x2="182" y2="455" stroke="#64748b" stroke-width="1"/>
  <circle cx="182" cy="455" r="3" fill="#64748b"/>

  <line x1="278" y1="440" x2="310" y2="455" stroke="#64748b" stroke-width="1"/>
  <line x1="342" y1="440" x2="310" y2="455" stroke="#64748b" stroke-width="1"/>
  <circle cx="310" cy="455" r="3" fill="#64748b"/>

  <line x1="182" y1="455" x2="246" y2="470" stroke="#64748b" stroke-width="1"/>
  <line x1="310" y1="455" x2="246" y2="470" stroke="#64748b" stroke-width="1"/>
  <circle cx="246" cy="470" r="3" fill="#64748b"/>

  <line x1="246" y1="467" x2="420" y2="445" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Single frontier node at level 2 -->
  <rect x="420" y="428" width="170" height="40" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="505" y="444" text-anchor="middle" font-size="10" font-weight="600" fill="#064e3b">F₂</text>
  <text x="505" y="458" text-anchor="middle" font-size="9" fill="#059669">level 2: full tree root</text>
</svg>
