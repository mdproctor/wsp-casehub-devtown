<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">CDI Event Observer Write Path — Two Layers, One Event</text>

  <!-- Event source -->
  <rect x="310" y="50" width="200" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="410" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">CaseLifecycleEvent</text>
  <text x="410" y="82" text-anchor="middle" font-size="10" fill="#3b82f6">fireAsync()</text>

  <!-- Arrow down splitting -->
  <line x1="410" y1="94" x2="410" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="110" x2="220" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="110" x2="600" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Engine layer (left) -->
  <rect x="60" y="140" width="320" height="60" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="156" font-size="9" fill="#059669" font-weight="600">ENGINE (casehub-ledger)</text>
  <text x="220" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="#064e3b">CaseLedgerEventCapture</text>
  <text x="220" y="190" text-anchor="middle" font-size="10" fill="#065f46">@ObservesAsync CaseLifecycleEvent</text>

  <!-- Devtown layer (right) -->
  <rect x="440" y="140" width="320" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="156" font-size="9" fill="#d97706" font-weight="600">DEVTOWN (application)</text>
  <text x="600" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="#78350f">MergeDecisionObserver</text>
  <text x="600" y="190" text-anchor="middle" font-size="10" fill="#92400e">@ObservesAsync CaseLifecycleEvent</text>

  <!-- Arrows to entries -->
  <line x1="220" y1="200" x2="220" y2="240" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="600" y1="200" x2="600" y2="240" stroke="#d97706" stroke-width="1.5"/>
  <path d="M 600 200 L 600 240" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Entry types -->
  <rect x="100" y="244" width="240" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="220" y="266" text-anchor="middle" font-size="12" font-weight="500" fill="#064e3b">CaseLedgerEntry</text>
  <text x="220" y="282" text-anchor="middle" font-size="10" fill="#065f46">lifecycle fields + digest</text>

  <rect x="480" y="244" width="240" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="600" y="266" text-anchor="middle" font-size="12" font-weight="500" fill="#78350f">MergeDecisionLedgerEntry</text>
  <text x="600" y="282" text-anchor="middle" font-size="10" fill="#92400e">PR number, decision, supplement</text>

  <!-- Both feed into save() -->
  <line x1="220" y1="294" x2="220" y2="324" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="600" y1="294" x2="600" y2="324" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LedgerEntryRepository.save() -->
  <rect x="100" y="328" width="240" height="36" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="220" y="350" text-anchor="middle" font-size="11" font-weight="500" fill="#3730a3">ledgerRepo.save(entry, tenancyId)</text>

  <rect x="480" y="328" width="240" height="36" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="600" y="350" text-anchor="middle" font-size="11" font-weight="500" fill="#3730a3">ledgerRepo.save(entry, tenancyId)</text>

  <!-- Shared Merkle frontier -->
  <line x1="220" y1="364" x2="410" y2="390" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <line x1="600" y1="364" x2="410" y2="390" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <rect x="310" y="382" width="200" height="30" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="410" y="402" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">Merkle Frontier Update</text>
</svg>
