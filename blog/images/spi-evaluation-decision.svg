<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">SPI Evaluation: Wire, Defer, or Reject?</text>

  <!-- Question 1 -->
  <rect x="220" y="44" width="240" height="44" rx="22" fill="#dbeafe" filter="url(#sh)"/>
  <text x="340" y="71" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Does the app need this capability?</text>

  <!-- No → Reject immediately -->
  <line x1="220" y1="66" x2="80" y2="66" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="80" y1="66" x2="80" y2="96" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrGrey)"/>
  <text x="150" y="58" text-anchor="middle" font-size="10" fill="#64748b">no</text>
  <rect x="20" y="98" width="120" height="36" rx="6" fill="#fee2e2" filter="url(#sh)"/>
  <text x="80" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Skip</text>

  <!-- Yes → Question 2 -->
  <line x1="340" y1="88" x2="340" y2="126" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="352" y="110" font-size="10" fill="#3b82f6">yes</text>

  <rect x="200" y="128" width="280" height="44" rx="22" fill="#dbeafe" filter="url(#sh)"/>
  <text x="340" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Does it add value over the current path?</text>

  <!-- No → Reject with ADR -->
  <line x1="200" y1="150" x2="80" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="80" y1="134" x2="80" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrGrey)"/>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#64748b">no</text>
  <rect x="12" y="182" width="136" height="50" rx="6" fill="#fef3c7" filter="url(#sh)" stroke="#d97706" stroke-width="1"/>
  <text x="80" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Reject + ADR</text>
  <text x="80" y="218" text-anchor="middle" font-size="9" fill="#a16207">#295 sidecar, #296 hooks</text>

  <!-- Yes → Question 3 -->
  <line x1="340" y1="172" x2="340" y2="210" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="352" y="194" font-size="10" fill="#3b82f6">yes</text>

  <rect x="200" y="212" width="280" height="44" rx="22" fill="#dbeafe" filter="url(#sh)"/>
  <text x="340" y="239" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Are the prerequisites available now?</text>

  <!-- No → Defer -->
  <line x1="480" y1="234" x2="580" y2="234" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="580" y1="234" x2="580" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrGrey)"/>
  <text x="530" y="226" text-anchor="middle" font-size="10" fill="#64748b">no</text>
  <rect x="520" y="262" width="120" height="36" rx="6" fill="#e0e7ff" filter="url(#sh)"/>
  <text x="580" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">Defer</text>

  <!-- Yes → Wire it -->
  <line x1="340" y1="256" x2="340" y2="280" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="352" y="272" font-size="10" fill="#059669">yes</text>
  <rect x="260" y="282" width="160" height="36" rx="6" fill="#d1fae5" filter="url(#sh)" stroke="#059669" stroke-width="2"/>
  <text x="340" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Wire it</text>

  <!-- Marker defs -->
  <defs>
    <marker id="arrGrey" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#059669" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Examples on the Wire path -->
  <text x="340" y="316" text-anchor="middle" font-size="9" fill="#065f46">#292 triage, #293 playbook, #294 bindingName</text>
</svg>
