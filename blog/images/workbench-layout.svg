<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" rx="8" fill="url(#bg)"/>

  <!-- Tab bar -->
  <rect x="0" y="0" width="800" height="40" rx="8" fill="#1a1a2e"/>
  <rect x="0" y="30" width="800" height="10" fill="#1a1a2e"/>
  <text x="20" y="26" font-size="12" font-weight="600" fill="#e0e0e0">Review Workbench</text>
  <line x1="16" y1="36" x2="148" y2="36" stroke="#60a5fa" stroke-width="2"/>
  <text x="160" y="26" font-size="12" fill="#888">Operations</text>
  <text x="260" y="26" font-size="12" fill="#888">Merge Queue</text>
  <text x="370" y="26" font-size="12" fill="#888">Reviewers</text>
  <text x="458" y="26" font-size="12" fill="#888">Contributors</text>
  <text x="558" y="26" font-size="12" fill="#888">System</text>

  <!-- Divider under tabs -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="#333" stroke-width="1"/>

  <!-- Split pane divider -->
  <line x1="310" y1="40" x2="310" y2="460" stroke="#333" stroke-width="1"/>

  <!-- LEFT: Timeline Spine -->
  <text x="20" y="65" font-size="10" fill="#666" text-transform="uppercase" letter-spacing="1">TIMELINE SPINE</text>

  <!-- Case 1: expanded -->
  <rect x="16" y="78" width="280" height="32" rx="4" fill="#1e1e2e"/>
  <rect x="16" y="78" width="3" height="32" rx="1" fill="#fbbf24"/>
  <text x="32" y="92" font-size="11" font-weight="600" fill="#e0e0e0">▼ PR #101</text>
  <text x="92" y="92" font-size="11" fill="#888">alice, auth refactor</text>

  <!-- Event nodes -->
  <line x1="30" y1="114" x2="30" y2="230" stroke="#333" stroke-width="1.5"/>
  <text x="44" y="126" font-size="10" fill="#4ade80">● Opened</text>
  <text x="240" y="126" font-size="9" fill="#555">2m ago</text>
  <text x="44" y="146" font-size="10" fill="#4ade80">● Code analysis: security-sensitive</text>
  <text x="44" y="166" font-size="10" fill="#4ade80">● Security review → agent-3</text>
  <text x="44" y="186" font-size="10" fill="#4ade80">● Style review: APPROVED</text>
  <rect x="38" y="196" width="220" height="18" rx="3" fill="#2a2a1e"/>
  <text x="44" y="209" font-size="10" fill="#fbbf24">◐ Security review: 2 findings</text>
  <text x="44" y="228" font-size="10" fill="#666">○ Human gate — pending</text>

  <!-- Case 2: collapsed -->
  <rect x="16" y="244" width="280" height="32" rx="4" fill="#1e1e2e"/>
  <rect x="16" y="244" width="3" height="32" rx="1" fill="#4ade80"/>
  <text x="32" y="258" font-size="11" font-weight="600" fill="#e0e0e0">▶ PR #98</text>
  <text x="88" y="258" font-size="11" fill="#888">bob, fix login</text>
  <text x="32" y="270" font-size="9" fill="#4ade80">approved, CI passed</text>
  <circle cx="282" cy="260" r="4" fill="#4ade80"/>

  <!-- Case 3: collapsed -->
  <rect x="16" y="284" width="280" height="32" rx="4" fill="#1e1e2e"/>
  <rect x="16" y="284" width="3" height="32" rx="1" fill="#f87171"/>
  <text x="32" y="298" font-size="11" font-weight="600" fill="#e0e0e0">▶ PR #95</text>
  <text x="88" y="298" font-size="11" fill="#888">carol, refactor DB</text>
  <text x="32" y="310" font-size="9" fill="#f87171">human gate, needs decision</text>
  <circle cx="282" cy="300" r="4" fill="#f87171"/>

  <!-- RIGHT: Intelligence Pane -->
  <text x="326" y="65" font-size="10" fill="#666" text-transform="uppercase" letter-spacing="1">INTELLIGENCE PANE — FINDINGS NODE</text>

  <!-- Findings header -->
  <text x="326" y="90" font-size="14" font-weight="600" fill="#e0e0e0">Security Review: 2 Findings</text>
  <text x="326" y="106" font-size="11" fill="#fbbf24">agent-3 · confidence 0.87</text>

  <!-- Finding 1 -->
  <rect x="326" y="118" width="454" height="44" rx="4" fill="#2a1a1a" stroke="#5c2020"/>
  <text x="336" y="136" font-size="11" font-weight="600" fill="#f87171">HIGH: Token not rotated after privilege escalation</text>
  <text x="336" y="152" font-size="10" fill="#888">src/auth/TokenService.java:142 · confidence 87%</text>

  <!-- Finding 2 -->
  <rect x="326" y="170" width="454" height="44" rx="4" fill="#2a2a1a" stroke="#5c5c20"/>
  <text x="336" y="188" font-size="11" font-weight="600" fill="#fbbf24">MEDIUM: Session fixation risk in redirect flow</text>
  <text x="336" y="204" font-size="10" fill="#888">src/auth/SessionManager.java:89 · confidence 71%</text>

  <!-- CBR Precedents -->
  <text x="326" y="238" font-size="10" fill="#666" text-transform="uppercase" letter-spacing="1">PRECEDENT COMPARISON (CBR)</text>

  <rect x="326" y="248" width="454" height="44" rx="4" fill="#1a1a2e" stroke="#4338ca"/>
  <rect x="326" y="248" width="3" height="44" rx="1" fill="#818cf8"/>
  <text x="340" y="266" font-size="11" fill="#c4b5fd">Similar finding in PR #67 (3 months ago)</text>
  <text x="340" y="282" font-size="10" fill="#888">Confirmed as real issue. 92% historical confirmation rate.</text>

  <!-- Contributor section -->
  <text x="326" y="318" font-size="10" fill="#666" text-transform="uppercase" letter-spacing="1">CONTRIBUTOR PROFILE</text>

  <rect x="326" y="328" width="454" height="60" rx="4" fill="#1e1e2e"/>
  <text x="336" y="346" font-size="11" font-weight="600" fill="#e0e0e0">alice</text>
  <text x="376" y="346" font-size="9" fill="#16a34a" font-weight="600">fast-track</text>
  <text x="336" y="362" font-size="10" fill="#888">47 merges · 91% first-attempt · 2 prior security findings</text>
  <!-- Trust bar -->
  <rect x="336" y="372" width="200" height="6" rx="3" fill="#333"/>
  <rect x="336" y="372" width="164" height="6" rx="3" fill="#60a5fa"/>
  <text x="542" y="378" font-size="9" fill="#888">0.82</text>

  <!-- Labels -->
  <text x="160" y="445" font-size="9" fill="#555" text-anchor="middle">← spine scrolls vertically</text>
  <text x="560" y="445" font-size="9" fill="#555" text-anchor="middle">← content switches per clicked node →</text>
</svg>
