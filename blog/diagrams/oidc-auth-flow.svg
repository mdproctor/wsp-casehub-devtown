<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">OIDC Authentication Flow — GitHub OAuth</text>

  <!-- Browser -->
  <rect x="30" y="60" width="120" height="50" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Browser</text>
  <text x="90" y="98" text-anchor="middle" font-size="10" fill="#64748b">SPA (index.ts)</text>

  <!-- Quarkus -->
  <rect x="220" y="60" width="140" height="50" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="290" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Quarkus OIDC</text>
  <text x="290" y="98" text-anchor="middle" font-size="10" fill="#64748b">hybrid mode</text>

  <!-- GitHub -->
  <rect x="440" y="60" width="140" height="50" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="510" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">GitHub OAuth</text>
  <text x="510" y="98" text-anchor="middle" font-size="10" fill="#64748b">read:org, user:email</text>

  <!-- Arrows: auth flow -->
  <line x1="150" y1="75" x2="218" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="184" y="68" text-anchor="middle" font-size="9" fill="#64748b">1. GET /api/userinfo</text>

  <line x1="360" y1="75" x2="438" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="399" y="68" text-anchor="middle" font-size="9" fill="#64748b">2. redirect</text>

  <line x1="438" y1="95" x2="362" y2="95" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="399" y="107" text-anchor="middle" font-size="9" fill="#64748b">3. code callback</text>

  <!-- Augmentor box -->
  <rect x="200" y="160" width="180" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">SecurityAugmentor</text>
  <text x="290" y="200" text-anchor="middle" font-size="10" fill="#2563eb">GitHubSecurityAugmentor</text>
  <text x="290" y="215" text-anchor="middle" font-size="10" fill="#2563eb">@UnlessBuildProfile("dev")</text>

  <line x1="290" y1="110" x2="290" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="298" y="138" font-size="9" fill="#64748b">4. augment identity</text>

  <!-- GitHub API box -->
  <rect x="460" y="160" width="160" height="70" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="540" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">GitHub API</text>
  <text x="540" y="200" text-anchor="middle" font-size="10" fill="#64748b">GitHubOrgApi</text>
  <text x="540" y="215" text-anchor="middle" font-size="10" fill="#64748b">REST client</text>

  <line x1="380" y1="195" x2="458" y2="195" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="419" y="188" text-anchor="middle" font-size="9" fill="#64748b">5. check org</text>

  <!-- Cache -->
  <rect x="200" y="275" width="100" height="45" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="250" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">Cache</text>
  <text x="250" y="310" text-anchor="middle" font-size="9" fill="#16a34a">5-min TTL</text>
  <line x1="260" y1="230" x2="260" y2="273" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#a2)"/>

  <!-- Role assignment -->
  <rect x="380" y="275" width="140" height="45" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Role Assignment</text>
  <text x="450" y="310" text-anchor="middle" font-size="9" fill="#64748b">ENGINEER + ADMIN</text>
  <line x1="310" y1="230" x2="420" y2="273" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="380" y="248" font-size="9" fill="#64748b">6. add roles</text>

  <!-- Attribute injection -->
  <rect x="560" y="275" width="160" height="45" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="640" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">tenancyId = org</text>
  <text x="640" y="310" text-anchor="middle" font-size="9" fill="#64748b">SecurityIdentityAttributes</text>
  <line x1="520" y1="297" x2="558" y2="297" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Return to browser -->
  <path d="M 290 230 L 290 370 L 90 370 L 90 112" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 3" fill="none" marker-end="url(#a2)"/>
  <text x="190" y="385" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="500">7. authenticated response + cookie</text>
</svg>
